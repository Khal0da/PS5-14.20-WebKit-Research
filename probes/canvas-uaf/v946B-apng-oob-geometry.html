<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V946B</title></head>
<body><pre id="out">V946B — APNG OOB geometry/size characterization (B)</pre>
<script>
'use strict';
var O=document.getElementById('out');
function say(s){O.textContent+='\n'+s;}
function bk(tag,body){
  try{new Image().src='/beacon/V946B-'+tag+'?d='+encodeURIComponent(String(body).slice(0,600))+'&t='+Date.now()+'&s=1';}catch(e){}
}
function hx(n){ var s=n.toString(16); return s.length<2?'0'+s:s; }
function pxh(d,w,x,y){ var i=(y*w+x)*4; return hx(d[i])+hx(d[i+1])+hx(d[i+2])+hx(d[i+3]); }
function loadImg(src){ return new Promise(function(res,rej){ var im=new Image(); im.onload=function(){res(im)}; im.onerror=function(){rej(new Error('load-fail'))}; im.src=src+'?cb='+Date.now()+'_'+Math.random(); }); }
async function run(name,src,fullW,fullH,frW,frH){
  bk('T-PRE',name);
  try{
    var im=await loadImg(src);
    var c=document.createElement('canvas'); c.width=fullW; c.height=fullH;
    var ctx=c.getContext('2d'); ctx.clearRect(0,0,fullW,fullH); ctx.drawImage(im,0,0);
    var d=ctx.getImageData(0,0,fullW,fullH).data;
    function row(y,x0,x1){ var a=[]; for(var x=x0;x<=x1;x++) a.push(x+'='+pxh(d,fullW,x,y)); return a.join(' '); }
    var y0 = row(0, Math.max(0,frW-2), Math.min(fullW-1,frW+10));
    var yb = row(frH, 0, Math.min(fullW-1,10)); // row just below frame
    var yb2 = row(Math.min(fullH-1,frH), Math.max(0,frW-2), Math.min(fullW-1,frW+10));
    bk('R0',name+'|full='+fullW+'x'+fullH+'|fr='+frW+'x'+frH+'|y0@edge|'+y0);
    bk('RB',name+'|y='+frH+'@x0..10|'+yb);
    bk('RE',name+'|y='+frH+'@edge|'+yb2);
    say(name+' R0 '+y0);
  }catch(e){ bk('T-ERR',name+'|'+String(e&&e.message||e).slice(0,140)); }
}
(async function(){
  bk('BOOT','geometry');
  await run('f64_fr8','v946b_f64_fr8.apng',64,64,8,8);
  await run('f64_fr16','v946b_f64_fr16.apng',64,64,16,16);
  await run('f64_fr32','v946b_f64_fr32.apng',64,64,32,32);
  await run('f128_fr16','v946b_f128_fr16.apng',128,64,16,16);
  bk('DONE','complete|note=see if anomalies track frame edge/stride');
  say('\nV946B complete.');
})();
</script>
</body></html>
