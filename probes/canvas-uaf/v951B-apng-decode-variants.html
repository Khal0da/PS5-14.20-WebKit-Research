<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V951B</title></head>
<body><pre id="out">V951B — APNG decode-variant geometry (hypothesis, B)</pre>
<script>
'use strict';
var O=document.getElementById('out');
function say(s){O.textContent+='\n'+s;}
function bk(tag,body){
  try{new Image().src='/beacon/V951B-'+tag+'?d='+encodeURIComponent(String(body).slice(0,700))+'&t='+Date.now()+'&s=1';}catch(e){}
}
function hx(n){ var s=n.toString(16); return s.length<2?'0'+s:s; }
function p32(d,w,x,y){ var i=(y*w+x)*4; return hx(d[i])+hx(d[i+1])+hx(d[i+2])+hx(d[i+3]); }
function isExpected(v, expectSet){
  // v is 8-char rgba hex
  for(var i=0;i<expectSet.length;i++) if(v===expectSet[i]) return true;
  return false;
}
function loadImg(src,n){ return new Promise(function(res,rej){ var im=new Image(); im.onload=function(){res(im)}; im.onerror=function(){rej(new Error('load-fail'))}; im.src=src+'?cb='+Date.now()+'_'+n+'_'+Math.random(); }); }

// scan specific rows/x-ranges for non-expected values
function scanCase(d,fullW,fullH,rows,xRanges,expect,label,iter){
  var anom=0, samp=[], byRow=[];
  for(var ri=0;ri<rows.length;ri++){
    var y=rows[ri]; if(y<0||y>=fullH) continue;
    var rv=0, rs=[];
    for(var xi=0;xi<xRanges.length;xi++){
      var x0=Math.max(0,xRanges[xi][0]), x1=Math.min(fullW-1,xRanges[xi][1]);
      for(var x=x0;x<=x1;x++){
        var v=p32(d,fullW,x,y);
        if(!isExpected(v,expect)){
          anom++; rv++;
          if(samp.length<6) samp.push('y'+y+'x'+x+'='+v);
          if(rs.length<4) rs.push('x'+x+'='+v);
        }
      }
    }
    if(rv>0) byRow.push('y'+y+':'+rv+'['+rs.join(',')+']');
  }
  bk('SCAN',label+'#'+iter+'|anom='+anom+'|'+(byRow.length?byRow.join('|'):'clean')+'|s='+samp.join(','));
  return {anom:anom,samp:samp,byRow:byRow};
}

async function runOne(name,src,fullW,fullH,cfg){
  bk('T-PRE',name);
  var results=[];
  for(var it=0;it<3;it++){
    try{
      var im=await loadImg(src,it);
      var c=document.createElement('canvas'); c.width=fullW; c.height=fullH;
      var ctx=c.getContext('2d'); ctx.clearRect(0,0,fullW,fullH); ctx.drawImage(im,0,0);
      var d=ctx.getImageData(0,0,fullW,fullH).data;
      // also report key anchor pixels for sanity
      var anchors=[];
      for(var ai=0;ai<cfg.anchors.length;ai++){
        var a=cfg.anchors[ai]; anchors.push(a[0]+','+a[1]+'='+p32(d,fullW,a[0],a[1]));
      }
      bk('ANCH',name+'#'+it+'|'+anchors.join('|'));
      var r=scanCase(d,fullW,fullH,cfg.rows,cfg.xRanges,cfg.expect,name,it);
      results.push(r);
    }catch(e){ bk('T-ERR',name+'#'+it+'|'+String(e&&e.message||e).slice(0,140)); }
  }
  // variability: compare sample strings across iters
  var sigs=results.map(function(r){return (r.samp||[]).join(';');});
  var varied=(sigs.length>=2 && sigs[0]!==sigs[sigs.length-1]);
  var totalAnom=0; results.forEach(function(r){totalAnom+=(r.anom||0);});
  bk('SUM',name+'|iters='+results.length+'|totalAnom='+totalAnom+'|varied='+varied);
  say(name+': anom='+totalAnom+' varied='+varied);
  return {name:name,totalAnom:totalAnom,varied:varied};
}

(async function(){
  bk('BOOT','decode-variant geometry; H:height-mismatch,dispose,twoframe,y-offset. STOP if no new window/behavior/useful signal');
  var GREEN='00ff00ff', RED='ff0000ff', BLUE='0000ffff', BLACK='00000000';
  var cases=[
    {
      name:'hmismatch_src', src:'v951b_hmismatch.apng', w:64, h:64,
      // fullW==frW==64, frH=16, blend SOURCE: rows 0-15 green, 16-63 red expected
      rows:[0,1,14,15,16,17,31,63],
      xRanges:[[0,63]],
      expect:[GREEN,RED],
      anchors:[[0,0],[63,0],[0,15],[0,16],[63,63]]
    },
    {
      name:'hmismatch_over', src:'v951b_hmismatch_over.apng', w:64, h:64,
      rows:[0,1,14,15,16,17,31,63],
      xRanges:[[0,63]],
      expect:[GREEN,RED],
      anchors:[[0,0],[63,0],[0,15],[0,16],[63,63]]
    },
    {
      name:'disposebg', src:'v951b_disposebg.apng', w:64, h:64,
      // 16x16 frame at 0,0 green, dispose=BACKGROUND. Composited output varies by impl;
      // allow green, red, transparent-black in frame region; red outside.
      rows:[0,1,15,16,17,32],
      xRanges:[[0,20],[60,63]],
      expect:[GREEN,RED,BLACK,'000000ff'],
      anchors:[[0,0],[15,0],[16,0],[0,15],[0,16],[32,32]]
    },
    {
      name:'twoframe', src:'v951b_twoframe.apng', w:64, h:64,
      // f1: 16x16 green at 0,0; f2: 8x8 blue at 4,4
      rows:[0,1,3,4,5,11,12,15,16],
      xRanges:[[0,20],[60,63]],
      expect:[GREEN,RED,BLUE],
      anchors:[[0,0],[4,4],[11,11],[12,4],[16,0],[32,32]]
    },
    {
      name:'h8_y8', src:'v951b_h8_y8.apng', w:64, h:64,
      // frame 64x8 at y=8: rows 0-7 red, 8-15 green, 16+ red
      rows:[0,7,8,9,15,16,17,32,63],
      xRanges:[[0,63]],
      expect:[GREEN,RED],
      anchors:[[0,0],[0,7],[0,8],[63,15],[0,16],[63,63]]
    }
  ];
  var anyNew=false;
  for(var i=0;i<cases.length;i++){
    var c=cases[i];
    var res=await runOne(c.name,c.src,c.w,c.h,c);
    if(res && res.totalAnom>0) anyNew=true;
  }
  bk('TOTAL','anyNewAnom='+anyNew+'|note=stop if no new disclosure window/behavior or no useful signal');
  bk('DONE','complete');
  say('\nV951B complete. anyNewAnom='+anyNew);
})();
</script>
</body></html>
