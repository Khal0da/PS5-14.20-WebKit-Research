<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V937B</title></head>
<body><pre id="out">V937B — Worker + transfer/clone surface (safe, B)</pre>
<script>
'use strict';
var O=document.getElementById('out');
function say(s){O.textContent+='\n'+s;}
function bk(tag,body){
  try{new Image().src='/beacon/V937B-'+tag+'?d='+encodeURIComponent(String(body).slice(0,500))+'&t='+Date.now()+'&s=1';}catch(e){}
}
function ok(name,r){ bk('T-OK',name+'|'+String(r).slice(0,420)); say('T-OK '+name+' '+r); }
function err(name,e){ var m=(e&&e.name?e.name:String(e))+':'+String(e&&e.message||e).slice(0,140); bk('T-ERR',name+'|'+m); say('T-ERR '+name+' '+m); }

bk('BOOT','Worker='+('Worker' in window)+',structuredClone='+('structuredClone' in window));

function withWorker(fn){
  return new Promise(function(resolve,reject){
    var src = "self.onmessage=function(e){var d=e.data; try{ if(d&&d.cmd==='ab'){ postMessage({ok:1,kind:'ab',len:d.buf.byteLength,view0:new Uint8Array(d.buf)[0]}); } else if(d&&d.cmd==='ib'){ postMessage({ok:1,kind:'ib',w:d.bm.width,h:d.bm.height,hasClose:('close' in d.bm)}); try{ if(d.bm.close) d.bm.close(); }catch(x){} } else if(d&&d.cmd==='sc'){ var c=structuredClone(d.val); postMessage({ok:1,kind:'sc',type:typeof c,keys:(c&&typeof c==='object')?Object.keys(c).join(','):''}); } else { postMessage({ok:0,kind:'unknown'}); } }catch(ex){ postMessage({ok:0,err:String(ex)}); } };";
    var u = URL.createObjectURL(new Blob([src], {type:'application/javascript'}));
    var w = new Worker(u);
    var done=false;
    w.onmessage=function(ev){ if(done) return; done=true; try{URL.revokeObjectURL(u);}catch(e){} try{w.terminate();}catch(e){} resolve(ev.data); };
    w.onerror=function(ev){ if(done) return; done=true; try{URL.revokeObjectURL(u);}catch(e){} try{w.terminate();}catch(e){} reject(new Error(ev.message||'worker-error')); };
    fn(w);
    setTimeout(function(){ if(done) return; done=true; try{w.terminate();}catch(e){} reject(new Error('timeout')); }, 4000);
  });
}

(async function(){
  try{
    bk('T-PRE','ab-transfer');
    var ab = new ArrayBuffer(16); new Uint8Array(ab)[0]=42;
    var r1 = await withWorker(function(w){ w.postMessage({cmd:'ab', buf:ab}, [ab]); });
    ok('ab-transfer','res='+JSON.stringify(r1)+',mainDetachedLen='+(ab.byteLength));
  }catch(e){ err('ab-transfer',e); }

  try{
    bk('T-PRE','imageBitmap-clone');
    var c=document.createElement('canvas'); c.width=8; c.height=8; c.getContext('2d').fillRect(0,0,8,8);
    var bm = await createImageBitmap(c);
    var r2 = await withWorker(function(w){ w.postMessage({cmd:'ib', bm:bm}); });
    ok('imageBitmap-clone','res='+JSON.stringify(r2));
    try{ bm.close(); }catch(e){}
  }catch(e){ err('imageBitmap-clone',e); }

  try{
    bk('T-PRE','structuredClone-nested');
    var val={a:1,b:[2,3],c:new Uint8Array([7,8]).buffer};
    var r3 = await withWorker(function(w){ w.postMessage({cmd:'sc', val:val}); });
    ok('structuredClone-nested','res='+JSON.stringify(r3));
  }catch(e){ err('structuredClone-nested',e); }

  bk('SWEEP-DONE','complete|note=no-ptr-leak-surface');
  bk('DONE','complete'); say('\nV937B complete.');
})();
</script>
</body></html>
